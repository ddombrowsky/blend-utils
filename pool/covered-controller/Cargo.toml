[package]
name = "covered-controller"
version = "1.0.0"
edition = "2021"
rust-version = "1.91.1"
license = "AGPL-3.0"
publish = false
description = "Blent Covered Pool access controller: supply/borrow open, backstop deposit allowlisted. Not upgradeable."

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "=27.0.3"

[dev-dependencies]
soroban-sdk = { version = "=27.0.3", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
